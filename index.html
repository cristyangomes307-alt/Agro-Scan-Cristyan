<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro Scan | Cristyan</title>
</head>
<body style="font-family:sans-serif; padding:20px; background:#f0f4f8; text-align:center;">

    <h2 style="color:#064e3b; margin-bottom:5px;">AGRO SCAN</h2>
    <p style="font-size:12px; color:#666; margin-top:0;">Desenvolvido por Cristyan</p>

    <div style="background:white; padding:20px; border-radius:20px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); max-width: 400px; margin: auto;">
        <p><b>1. Escolha a Cultura:</b></p>
        <select id="cultura" style="width:100%; padding:12px; border-radius:10px; border:1px solid #ccc; font-size:16px;">
            <option value="soja">Soja 🌱</option>
            <option value="maracuja">Maracujá 🟡</option>
            <option value="laranja">Laranja 🍊</option>
            <option value="milho">Milho 🌽</option>
        </select>

        <p><b>2. Foto ou Print da Folha:</b></p>
        <input type="file" id="foto" accept="image/*" onchange="processar(this)" style="font-size:14px;">
        
        <canvas id="canvas" style="display:none;"></canvas>
        <img id="pre" style="width:100%; display:none; border-radius:15px; margin-top:15px; border: 1px solid #ddd;">

        <button id="btn" onclick="enviar()" style="display:none; width:100%; padding:18px; background:#10b981; color:white; border:none; border-radius:15px; font-weight:bold; margin-top:20px; font-size:18px; width:100%;">ANALISAR AGORA</button>
    </div>

    <div id="status" style="display:none; margin-top:20px; color:#064e3b; font-weight:bold;">
        🔍 IA ANALISANDO... AGUARDE.
    </div>

    <div id="res" style="margin-top:25px; background:#fff; padding:20px; border-radius:20px; display:none; text-align:left; max-width: 400px; margin: 25px auto; border-left: 8px solid #10b981; box-shadow: 0 5px 10px rgba(0,0,0,0.05);"></div>

    <script>
        // SUA CHAVE NOVA APLICADA
        const MINHA_CHAVE = "AIzaSyBgksTNMHZu8wCEuySm-uvvI9ie2s3WJMo"; 
        let fotoPronta = "";

        function processar(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.getElementById('canvas');
                        const ctx = canvas.getContext('2d');
                        // Redimensionamento para garantir leveza no celular
                        const maxDim = 600;
                        let w = img.width;
                        let h = img.height;
                        if (w > h) { if (w > maxDim) { h *= maxDim / w; w = maxDim; } }
                        else { if (h > maxDim) { w *= maxDim / h; h = maxDim; } }
                        canvas.width = w; canvas.height = h;
                        ctx.drawImage(img, 0, 0, w, h);
                        fotoPronta = canvas.toDataURL('image/jpeg', 0.6).split(',')[1];
                        document.getElementById('pre').src = canvas.toDataURL('image/jpeg');
                        document.getElementById('pre').style.display = "block";
                        document.getElementById('btn').style.display = "block";
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function enviar() {
            const status = document.getElementById('status');
            const res = document.getElementById('res');
            const btn = document.getElementById('btn');
            
            status.style.display = "block";
            res.style.display = "none";
            btn.style.display = "none";

            const planta = document.getElementById('cultura').value;

            try {
                const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + MINHA_CHAVE, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [
                            { text: "Você é um especialista em agronomia. Analise esta folha de " + planta + ". Identifique a doença provável e sugira um tratamento prático. Responda em português de forma clara." },
                            { inlineData: { mimeType: "image/jpeg", data: fotoPronta } }
                        ]}]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content) {
                    const respostaIA = data.candidates[0].content.parts[0].text;
                    res.innerHTML = "<h3 style='color:#064e3b; margin-top:0;'>Diagnóstico:</h3>" + respostaIA.replace(/\n/g, "<br>");
                    res.style.display = "block";
                    res.scrollIntoView({ behavior: 'smooth' });
                } else {
                    alert("A IA não conseguiu processar. Tente tirar a foto com o celular mais firme e boa luz.");
                }
            } catch (error) {
                alert("Erro de conexão. Tente novamente em alguns segundos.");
            } finally {
                status.style.display = "none";
                btn.style.display = "block";
            }
        }
    </script>
</body>
</html>
