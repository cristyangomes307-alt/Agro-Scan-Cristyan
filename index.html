<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agro Scan Pro - Cristyan Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        :root { --primary: #064e3b; --accent: #10b981; --bg: #f8fafc; }
        body { background-color: var(--bg); font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        .main-header { background: linear-gradient(135deg, #022c22 0%, #064e3b 100%); position: relative; padding: 3.5rem 1.5rem 5rem 1.5rem; border-bottom-left-radius: 2.5rem; border-bottom-right-radius: 2.5rem; z-index: 50; }
        .watermark { position: absolute; top: 1.25rem; right: 1.5rem; font-size: 9px; color: rgba(16, 185, 129, 0.5); letter-spacing: 0.2em; font-weight: 800; text-transform: uppercase; z-index: 60; }
        .menu-card { background: white; border-radius: 1.5rem; padding: 1.25rem; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid rgba(0,0,0,0.05); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.04); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .menu-card:active { transform: scale(0.92); background: #ecfdf5; border-color: #10b981; }
        .loader { border: 3px solid #e2e8f0; border-top: 3px solid #10b981; border-radius: 50%; width: 50px; height: 50px; animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .laudo-content h1 { font-size: 1.8rem; font-weight: 800; color: #064e3b; margin-top: 0.5rem; margin-bottom: 1rem; line-height: 1.1; letter-spacing: -0.02em; }
        .laudo-content h2 { font-size: 1.1rem; font-weight: 700; color: #10b981; margin-top: 1.5rem; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; border-bottom: 1px solid #f1f5f9; padding-bottom: 4px; }
        .laudo-content p { color: #475569; line-height: 1.6; font-size: 0.95rem; margin-bottom: 0.8rem; }
        .laudo-content b { color: #0f172a; font-weight: 700; }
        .severity-pill { display: inline-flex; align-items: center; padding: 0.35rem 0.85rem; border-radius: 9999px; font-size: 10px; font-weight: 800; text-transform: uppercase; background: #dcfce7; color: #166534; margin-bottom: 0.5rem; border: 1px solid #bbf7d0; }
    </style>
</head>
<body class="pb-10">

    <header class="main-header text-white shadow-2xl">
        <div class="watermark">Criado por Cristyan</div>
        <div class="max-w-4xl mx-auto flex items-center gap-5">
            <div class="w-14 h-14 bg-emerald-500/20 rounded-2xl flex items-center justify-center backdrop-blur-md border border-emerald-400/30">
                <i class="fas fa-microscope text-2xl text-emerald-300"></i>
            </div>
            <div>
                <h1 class="text-2xl font-extrabold tracking-tighter">Agro Scan <span class="text-emerald-400 text-base">PRO</span></h1>
                <p class="text-emerald-200/60 text-[9px] font-bold uppercase tracking-[0.2em]">Inteligência Fitopatológica</p>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-5 -mt-12 relative z-10">
        <div id="step-1" class="space-y-8">
            <div class="flex items-center justify-between px-2">
                <h2 class="text-[11px] font-extrabold text-slate-400 uppercase tracking-widest">Painel de Culturas</h2>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <button onclick="selectCulture('Soja')" class="menu-card group">
                    <div class="w-14 h-14 bg-green-50 text-green-600 rounded-2xl flex items-center justify-center mb-3 text-2xl group-active:bg-green-600 group-active:text-white"><i class="fas fa-seedling"></i></div>
                    <span class="font-extrabold text-slate-700 text-sm">Soja</span>
                </button>
                <button onclick="selectCulture('Feijão')" class="menu-card group">
                    <div class="w-14 h-14 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center mb-3 text-2xl group-active:bg-amber-600 group-active:text-white"><i class="fas fa-leaf"></i></div>
                    <span class="font-extrabold text-slate-700 text-sm">Feijão</span>
                </button>
                <button onclick="selectCulture('Maracujá')" class="menu-card group">
                    <div class="w-14 h-14 bg-purple-50 text-purple-600 rounded-2xl flex items-center justify-center mb-3 text-2xl group-active:bg-purple-600 group-active:text-white"><i class="fas fa-lemon"></i></div>
                    <span class="font-extrabold text-slate-700 text-sm">Maracujá</span>
                </button>
                <button onclick="selectCulture('Laranja')" class="menu-card group">
                    <div class="w-14 h-14 bg-orange-50 text-orange-600 rounded-2xl flex items-center justify-center mb-3 text-2xl group-active:bg-orange-600 group-active:text-white"><i class="fas fa-circle"></i></div>
                    <span class="font-extrabold text-slate-700 text-sm">Laranja</span>
                </button>
            </div>
        </div>

        <div id="step-2" class="hidden mt-14 space-y-6">
            <div class="flex items-center justify-between bg-white/80 backdrop-blur-md p-3 rounded-2xl border border-white shadow-sm">
                <div class="flex items-center gap-3">
                    <div id="culture-icon-mini" class="w-10 h-10 bg-emerald-600 rounded-xl flex items-center justify-center shadow-md text-white"></div>
                    <h3 id="display-culture" class="font-extrabold text-slate-800 text-lg uppercase tracking-tighter"></h3>
                </div>
                <button onclick="resetApp()" class="w-10 h-10 bg-white shadow-sm border border-slate-100 rounded-full flex items-center justify-center text-slate-400 active:scale-90"><i class="fas fa-times"></i></button>
            </div>
            <div class="bg-white rounded-3xl p-2 border-2 border-dashed border-emerald-100 relative overflow-hidden shadow-inner" onclick="document.getElementById('file-input').click()">
                <div id="placeholder" class="py-24 text-center">
                    <div class="w-20 h-20 bg-emerald-50 rounded-full flex items-center justify-center mx-auto mb-4 border border-emerald-100 shadow-sm"><i class="fas fa-images text-4xl text-emerald-400"></i></div>
                    <p class="font-extrabold text-slate-500 text-sm">Escolher da Galeria</p>
                </div>
                <img id="preview" class="hidden w-full h-auto max-h-[500px] object-contain rounded-2xl">
            </div>
            <input type="file" id="file-input" class="hidden" accept="image/*">
            <button id="btn-analyze" onclick="startAnalysis()" class="hidden w-full bg-emerald-600 text-white py-6 rounded-3xl font-black text-xl shadow-2xl active:scale-95 transition-all">GERAR DIAGNÓSTICO</button>
        </div>

        <div id="loader-area" class="hidden py-32 text-center">
            <div class="loader mx-auto mb-8"></div>
            <h2 class="text-emerald-950 font-black text-xl italic tracking-tighter">ANALISANDO AMOSTRA...</h2>
            <p class="text-slate-400 text-xs mt-2 uppercase font-bold tracking-[0.2em]">Processamento via OpenAI GPT-4o</p>
        </div>

        <div id="result-area" class="hidden space-y-6 pt-14">
            <div class="bg-white rounded-[2.5rem] p-8 laudo-content shadow-2xl relative overflow-hidden" id="output-text"></div>
            <div class="flex gap-3">
                <button onclick="resetApp()" class="flex-1 bg-slate-900 text-white py-5 rounded-2xl font-black uppercase text-xs tracking-widest shadow-lg active:scale-95">Nova Análise</button>
                <button onclick="window.print()" class="w-16 bg-white border border-slate-200 rounded-2xl text-slate-600 flex items-center justify-center shadow-md"><i class="fas fa-print"></i></button>
            </div>
        </div>
    </main>

    <script>
        const apiKey = "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";
        let currentCulture = "";
        let base64Image = "";

        const icons = {
            'Soja': '<i class="fas fa-seedling"></i>',
            'Feijão': '<i class="fas fa-leaf"></i>',
            'Maracujá': '<i class="fas fa-lemon"></i>',
            'Laranja': '<i class="fas fa-circle"></i>'
        };

        function selectCulture(c) {
            currentCulture = c;
            document.getElementById('display-culture').innerText = c;
            document.getElementById('culture-icon-mini').innerHTML = icons[c];
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetApp() {
            base64Image = "";
            document.querySelectorAll('main > div, #loader-area, #result-area').forEach(d => d.classList.add('hidden'));
            document.getElementById('step-1').classList.remove('hidden');
            document.getElementById('preview').classList.add('hidden');
            document.getElementById('placeholder').classList.remove('hidden');
            document.getElementById('btn-analyze').classList.add('hidden');
            document.getElementById('file-input').value = "";
        }

        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const max_size = 800;
                    let width = img.width, height = img.height;
                    if (width > height) { if (width > max_size) { height *= max_size / width; width = max_size; } }
                    else { if (height > max_size) { width *= max_size / height; height = max_size; } }
                    canvas.width = width; canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    base64Image = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];
                    document.getElementById('preview').src = canvas.toDataURL('image/jpeg');
                    document.getElementById('preview').classList.remove('hidden');
                    document.getElementById('placeholder').classList.add('hidden');
                    document.getElementById('btn-analyze').classList.remove('hidden');
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        });

        async function startAnalysis() {
            const loader = document.getElementById('loader-area');
            const step2 = document.getElementById('step-2');
            loader.classList.remove('hidden');
            step2.classList.add('hidden');

            const systemPrompt = `Aja como o 'Agro Scan Pro'. Forneça um diagnóstico clínico fitopatológico.
            ESTRUTURA: 
            # NOME DA DOENÇA
            ## 🧬 Etiologia e Causa Raiz
            - **Agente:** Nome científico
            - **Causa Ambiental:** Contexto
            ## 🔍 Evidências Visuais
            - Sintomas detectados
            ## 🛠️ Protocolo de Manejo
            - **Tratamento:** Intervenção
            - **Prevenção:** Manejo
            ## 📊 Confiança: X%`;

            try {
                const resp = await fetch("https://api.openai.com/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "gpt-4o-mini",
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: [
                                { type: "text", text: `Analise a imagem da cultura ${currentCulture} e dê o diagnóstico.` },
                                { type: "image_url", image_url: { url: `data:image/jpeg;base64,${base64Image}` } }
                            ]}
                        ],
                        max_tokens: 800
                    })
                });

                const data = await resp.json();
                const text = data.choices[0].message.content;
                showResult(text);
            } catch (err) {
                alert("Erro na análise. Verifique sua conexão ou créditos da API.");
                resetApp();
            } finally {
                loader.classList.add('hidden');
            }
        }

        function showResult(text) {
            const output = document.getElementById('output-text');
            const html = text
                .replace(/^# (.*$)/gim, '<div class="severity-pill">Diagnóstico Concluído</div><h1>$1</h1>')
                .replace(/^## (.*$)/gim, '<h2><i class="fas fa-check-circle text-[10px]"></i> $1</h2>')
                .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
                .replace(/\n/g, '<br>');
            output.innerHTML = html;
            document.getElementById('result-area').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
