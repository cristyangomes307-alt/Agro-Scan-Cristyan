<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro Scan | Cristyan</title>
</head>
<body style="font-family:sans-serif; padding:20px; background:#f0f4f8; text-align:center;">

    <h2 style="color:#064e3b;">AGRO SCAN - CRISTYAN</h2>

    <div style="background:white; padding:20px; border-radius:20px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); max-width: 400px; margin: auto;">
        <p><b>1. Planta selecionada:</b></p>
        <select id="cultura" style="width:100%; padding:12px; border-radius:10px;">
            <option value="soja">Soja 🌱</option>
            <option value="maracuja">Maracujá 🟡</option>
            <option value="laranja">Laranja 🍊</option>
            <option value="milho">Milho 🌽</option>
        </select>

        <p><b>2. Foto ou Print da folha:</b></p>
        <input type="file" id="foto" accept="image/*" onchange="ver(this)">
        
        <img id="pre" style="width:100%; display:none; border-radius:15px; margin-top:15px; border: 1px solid #ddd;">

        <button id="btn" onclick="enviar()" style="display:none; width:100%; padding:18px; background:#10b981; color:white; border:none; border-radius:15px; font-weight:bold; margin-top:20px;">ANALISAR AGORA</button>
    </div>

    <div id="status" style="display:none; margin-top:20px; color:#064e3b; font-weight:bold;">IA ANALISANDO...</div>
    <div id="res" style="margin-top:25px; background:#fff; padding:20px; border-radius:20px; display:none; text-align:left; max-width: 400px; margin: 25px auto; border-left: 8px solid #10b981;"></div>

    <script>
        const KEY = "AIzaSyCpiU5tzmwUKX_avjRbrO-dDtSNSGnSS40";
        let fotoData = "";

        function ver(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    fotoData = e.target.result.split(',')[1];
                    document.getElementById('pre').src = e.target.result;
                    document.getElementById('pre').style.display = "block";
                    document.getElementById('btn').style.display = "block";
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function enviar() {
            document.getElementById('status').style.display = "block";
            document.getElementById('btn').style.display = "none";
            
            const planta = document.getElementById('cultura').value;

            // Prompt super detalhado para evitar que a IA recuse
            const corpo = {
                contents: [{
                    parts: [
                        { text: "Aja como um especialista em fitopatologia. Analise esta imagem de uma folha de " + planta + ". Descreva as lesões, identifique a doença e recomende o tratamento químico e orgânico. Se a imagem estiver difícil, use seu conhecimento sobre as doenças mais comuns desta cultura no Brasil para dar um diagnóstico provável." },
                        { inlineData: { mimeType: "image/jpeg", data: fotoData } }
                    ]
                }],
                safetySettings: [
                    { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
                    { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
                    { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
                    { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" }
                ]
            };

            try {
                const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + KEY, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(corpo)
                });

                const d = await r.json();
                const texto = d.candidates[0].content.parts[0].text;
                document.getElementById('res').innerHTML = "<b>Diagnóstico:</b><br>" + texto.replace(/\n/g, "<br>");
                document.getElementById('res').style.display = "block";
            } catch (e) {
                alert("A IA ainda não conseguiu processar. Tente uma foto de mais longe.");
            } finally {
                document.getElementById('status').style.display = "none";
                document.getElementById('btn').style.display = "block";
            }
        }
    </script>
</body>
</html>
