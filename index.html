<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro Scan | Cristyan</title>
</head>
<body style="font-family:sans-serif; padding:20px; background:#f0f4f8; text-align:center;">

    <h2 style="color:#064e3b; letter-spacing:-1px;">AGRO SCAN - CRISTYAN</h2>

    <div style="background:white; padding:20px; border-radius:20px; box-shadow: 0 10px 15px rgba(0,0,0,0.05); max-width: 400px; margin: auto;">
        <p style="font-size:14px; color:#64748b;"><b>1. O que vamos analisar?</b></p>
        <select id="cultura" style="width:100%; padding:12px; border-radius:10px; border:1px solid #e2e8f0; margin-bottom:15px;">
            <option value="soja">Soja 🌱</option>
            <option value="maracuja">Maracujá 🟡</option>
            <option value="laranja">Laranja 🍊</option>
            <option value="milho">Milho 🌽</option>
        </select>

        <p style="font-size:14px; color:#64748b;"><b>2. Foto da folha:</b></p>
        <input type="file" id="foto" accept="image/*" onchange="ver(this)" style="font-size:12px;">
        
        <img id="pre" style="width:100%; display:none; border-radius:15px; margin-top:15px; border: 2px solid #f1f5f9;">

        <button id="btn" onclick="enviar()" style="display:none; width:100%; padding:18px; background:#10b981; color:white; border:none; border-radius:15px; font-weight:900; margin-top:20px; box-shadow: 0 4px 12px rgba(16,185,129,0.2);">ANALISAR AGORA</button>
    </div>

    <div id="status" style="display:none; margin-top:25px;">
        <div style="width:30px; height:30px; border:4px solid #10b981; border-top-color:transparent; border-radius:50%; animation: spin 1s linear infinite; margin:auto;"></div>
        <p style="color:#064e3b; font-weight:bold; font-size:12px; margin-top:10px;">IA PROCESSANDO...</p>
    </div>

    <div id="res" style="margin-top:25px; background:#fff; padding:20px; border-radius:20px; display:none; text-align:left; max-width: 400px; margin: 25px auto; border-left: 8px solid #10b981;"></div>

    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>

    <script>
        const KEY = "AIzaSyCpiU5tzmwUKX_avjRbrO-dDtSNSGnSS40";
        let fotoData = "";

        function ver(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    // Limpa o base64 para a IA não se confundir
                    fotoData = e.target.result.split(',')[1];
                    document.getElementById('pre').src = e.target.result;
                    document.getElementById('pre').style.display = "block";
                    document.getElementById('btn').style.display = "block";
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function enviar() {
            const status = document.getElementById('status');
            const resDiv = document.getElementById('res');
            const btn = document.getElementById('btn');
            
            status.style.display = "block";
            resDiv.style.display = "none";
            btn.style.display = "none";
            
            const planta = document.getElementById('cultura').value;

            try {
                const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + KEY, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "Você é um agrônomo experiente. Analise a saúde desta folha de " + planta + ". Identifique sinais de pragas ou doenças. Se houver algo, explique o que é e dê uma recomendação de tratamento. Responda de forma clara e profissional em português brasileiro." },
                                { inlineData: { mimeType: "image/jpeg", data: fotoData } }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content) {
                    const textoIA = data.candidates[0].content.parts[0].text;
                    resDiv.innerHTML = "<h3 style='color:#064e3b; margin-top:0;'>Diagnóstico Técnico:</h3>" + textoIA.replace(/\n/g, "<br>");
                    resDiv.style.display = "block";
                    resDiv.scrollIntoView({ behavior: 'smooth' });
                } else {
                    alert("A IA não conseguiu analisar. Tente tirar a foto com mais luz ou de outro ângulo.");
                }
            } catch (e) {
                alert("Erro de conexão. Verifique se o seu celular está com internet.");
            } finally {
                status.style.display = "none";
                btn.style.display = "block";
            }
        }
    </script>
</body>
</html>
