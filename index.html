<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro Scan Final</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 pb-10 font-sans">

    <header class="bg-green-900 text-white p-8 shadow-lg text-center rounded-b-[2rem]">
        <h1 class="text-3xl font-black italic">AGRO SCAN</h1>
        <p class="text-green-300 text-xs">Sistema de Diagnóstico IA</p>
    </header>

    <main class="max-w-md mx-auto p-4 -mt-6">
        <div id="painel-principal" class="bg-white rounded-3xl shadow-xl p-6">
            
            <div id="bloco-selecao">
                <p class="text-center font-bold text-gray-500 mb-4 uppercase text-xs">Escolha a Cultura</p>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="definirCultura('Soja')" class="p-4 border-2 border-green-50 rounded-2xl bg-green-50/30 hover:bg-green-100 flex flex-col items-center">
                        <i class="fas fa-seedling text-green-700 text-xl"></i>
                        <span class="font-bold text-sm mt-2">Soja</span>
                    </button>
                    <button onclick="definirCultura('Feijão')" class="p-4 border-2 border-green-50 rounded-2xl bg-green-50/30 hover:bg-green-100 flex flex-col items-center">
                        <i class="fas fa-leaf text-green-700 text-xl"></i>
                        <span class="font-bold text-sm mt-2">Feijão</span>
                    </button>
                </div>
            </div>

            <div id="bloco-upload" class="hidden">
                <div class="border-4 border-dashed border-gray-100 rounded-3xl p-4 text-center cursor-pointer" onclick="document.getElementById('input-foto').click()">
                    <img id="img-preview" class="hidden w-full rounded-2xl mb-4">
                    <div id="info-upload">
                        <i class="fas fa-camera text-4xl text-gray-200 mb-2"></i>
                        <p class="text-gray-400 font-bold">Tirar ou Abrir Foto</p>
                    </div>
                </div>
                <input type="file" id="input-foto" class="hidden" accept="image/*">
                <button id="btn-gerar" onclick="executarAnalise()" class="hidden w-full bg-green-600 text-white py-4 rounded-2xl font-black mt-4 shadow-lg">ANALISAR AGORA</button>
            </div>

            <div id="bloco-loading" class="hidden text-center py-10">
                <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-green-700 mx-auto mb-4"></div>
                <p class="font-black text-green-800 animate-pulse">ESTUDANDO PLANTA...</p>
            </div>

            <div id="bloco-resultado" class="hidden">
                <div id="texto-resultado" class="prose prose-green"></div>
                <button onclick="location.reload()" class="w-full bg-gray-800 text-white py-4 rounded-2xl font-bold mt-6">NOVO TESTE</button>
            </div>
        </div>
    </main>

    <script>
        const MINHA_CHAVE = "AIzaSyB3z48pV_WD2aFzq3fU5ND6sZw5UsRsfNw";
        let culturaAtiva = "";
        let fotoBase64 = "";

        function definirCultura(c) {
            culturaAtiva = c;
            document.getElementById('bloco-selecao').classList.add('hidden');
            document.getElementById('bloco-upload').classList.remove('hidden');
        }

        document.getElementById('input-foto').onchange = function(e) {
            const f = e.target.files[0];
            const r = new FileReader();
            r.onload = (ev) => {
                fotoBase64 = ev.target.result.split(',')[1];
                document.getElementById('img-preview').src = ev.target.result;
                document.getElementById('img-preview').classList.remove('hidden');
                document.getElementById('info-upload').classList.add('hidden');
                document.getElementById('btn-gerar').classList.remove('hidden');
            };
            r.readAsDataURL(f);
        };

        async function executarAnalise() {
            document.getElementById('bloco-upload').classList.add('hidden');
            document.getElementById('bloco-loading').classList.remove('hidden');

            // AQUI ESTÁ O SEGREDO: v1beta COM TIMESTAMP PARA EVITAR CACHE DA API
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${MINHA_CHAVE}`;

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                {text: `Analise esta planta de ${culturaAtiva} e diga a doença e tratamento.`},
                                {inlineData: {mimeType: "image/jpeg", data: fotoBase64}}
                            ]
                        }]
                    })
                });

                const json = await res.json();
                if (json.error) throw new Error(json.error.message);

                const final = json.candidates[0].content.parts[0].text;
                document.getElementById('texto-resultado').innerHTML = final.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
                
                document.getElementById('bloco-loading').classList.add('hidden');
                document.getElementById('bloco-resultado').classList.remove('hidden');
            } catch (e) {
                alert("Erro: " + e.message);
                location.reload();
            }
        }
    </script>
</body>
</html>
