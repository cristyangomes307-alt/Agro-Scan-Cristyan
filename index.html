<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro Scan - Cristyan</title>
</head>
<body style="font-family:sans-serif; padding:20px; background:#f0f4f8; text-align:center;">

    <h2 style="color:#064e3b;">AGRO SCAN</h2>
    <p style="font-size:12px; color:#666;">Versão Profissional | Cristyan</p>

    <div style="background:white; padding:20px; border-radius:20px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); max-width: 400px; margin: auto;">
        <p><b>1. Planta:</b></p>
        <select id="cultura" style="width:100%; padding:12px; border-radius:10px; border:1px solid #ccc;">
            <option value="soja">Soja 🌱</option>
            <option value="maracuja">Maracujá 🟡</option>
            <option value="laranja">Laranja 🍊</option>
            <option value="milho">Milho 🌽</option>
        </select>

        <p><b>2. Foto ou Print:</b></p>
        <input type="file" id="foto" accept="image/*" onchange="processar(this)">
        
        <canvas id="canvas" style="display:none;"></canvas>
        <img id="pre" style="width:100%; display:none; border-radius:15px; margin-top:15px; border: 1px solid #ddd;">

        <button id="btn" onclick="enviar()" style="display:none; width:100%; padding:18px; background:#10b981; color:white; border:none; border-radius:15px; font-weight:bold; margin-top:20px;">ANALISAR AGORA</button>
    </div>

    <div id="status" style="display:none; margin-top:20px; color:#064e3b; font-weight:bold;">🔍 IA ANALISANDO MANCHAS...</div>
    <div id="res" style="margin-top:25px; background:#fff; padding:20px; border-radius:20px; display:none; text-align:left; max-width: 400px; margin: 25px auto; border-left: 8px solid #10b981;"></div>

    <script>
        const MINHA_CHAVE = "AIzaSyBgksTNMHZu8wCEuySm-uvvI9ie2s3WJMo"; 
        let imagemFinal = "";

        function processar(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.getElementById('canvas');
                        const ctx = canvas.getContext('2d');
                        // Reduz a imagem para 600px para garantir que funcione no S21 FE
                        const max = 600;
                        let w = img.width, h = img.height;
                        if (w > h) { if (w > max) { h *= max / w; w = max; } }
                        else { if (h > max) { w *= max / h; h = max; } }
                        canvas.width = w; canvas.height = h;
                        ctx.drawImage(img, 0, 0, w, h);
                        imagemFinal = canvas.toDataURL('image/jpeg', 0.6).split(',')[1];
                        document.getElementById('pre').src = canvas.toDataURL('image/jpeg');
                        document.getElementById('pre').style.display = "block";
                        document.getElementById('btn').style.display = "block";
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function enviar() {
            document.getElementById('status').style.display = "block";
            document.getElementById('res').style.display = "none";
            document.getElementById('btn').style.display = "none";

            try {
                const planta = document.getElementById('cultura').value;
                const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + MINHA_CHAVE, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [
                            { text: "ANALISE OBRIGATÓRIA: Identifique a doença nestas manchas da folha de " + planta + ". Não recuse a imagem. Diga o nome da doença e o tratamento. Responda em português." },
                            { inlineData: { mimeType: "image/jpeg", data: imagemFinal } }
                        ]}]
                    })
                });

                const data = await r.json();
                const textoIA = data.candidates[0].content.parts[0].text;
                document.getElementById('res').innerHTML = "<h3>Diagnóstico:</h3>" + textoIA.replace(/\n/g, "<br>");
                document.getElementById('res').style.display = "block";
            } catch (e) {
                alert("Erro ao analisar. Tente novamente com um print da foto.");
            } finally {
                document.getElementById('status').style.display = "none";
                document.getElementById('btn').style.display = "block";
            }
        }
    </script>
</body>
</html>
