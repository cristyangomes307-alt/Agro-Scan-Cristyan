<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro Scan - Inteligência Fitossanitária</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #1b4332; --secondary: #2d6a4f; --bg: #f4f7f5; }
        body { background-color: var(--bg); font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .gradient-header { background: linear-gradient(135deg, #081c15 0%, #1b4332 100%); }
        .card { background: white; border-radius: 1.5rem; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #2d6a4f; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .laudo-content h1 { color: #1b4332; font-weight: 900; font-size: 1.4rem; margin-bottom: 1rem; border-bottom: 2px solid #d8f3dc; }
        .laudo-content h2 { color: #2d6a4f; font-weight: 700; font-size: 1.1rem; margin-top: 1rem; }
    </style>
</head>
<body class="pb-10">

    <header class="gradient-header text-white p-10 shadow-xl text-center">
        <h1 class="text-3xl font-black italic italic tracking-tighter">AGRO SCAN</h1>
        <p class="text-green-200/80 text-sm">IA Fitopatológica</p>
    </header>

    <main class="max-w-4xl mx-auto p-4 -mt-8">
        <div id="step-1" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <button onclick="selectCulture('Soja')" class="card p-6 flex flex-col items-center active:scale-95 transition-all">
                    <i class="fas fa-seedling text-green-700 text-2xl mb-2"></i>
                    <span class="font-bold">Soja</span>
                </button>
                <button onclick="selectCulture('Feijão')" class="card p-6 flex flex-col items-center active:scale-95 transition-all">
                    <i class="fas fa-leaf text-amber-700 text-2xl mb-2"></i>
                    <span class="font-bold">Feijão</span>
                </button>
                <button onclick="selectCulture('Maracujá')" class="card p-6 flex flex-col items-center active:scale-95 transition-all">
                    <i class="fas fa-lemon text-purple-600 text-2xl mb-2"></i>
                    <span class="font-bold">Maracujá</span>
                </button>
                <button onclick="selectCulture('Laranja')" class="card p-6 flex flex-col items-center active:scale-95 transition-all">
                    <i class="fas fa-circle text-orange-500 text-2xl mb-2"></i>
                    <span class="font-bold">Laranja</span>
                </button>
            </div>
        </div>

        <div id="step-2" class="hidden space-y-4">
            <div class="card p-4 text-center">
                <div class="border-2 border-dashed border-gray-300 rounded-xl p-10 cursor-pointer" onclick="document.getElementById('file-input').click()">
                    <img id="preview" class="hidden w-full rounded-lg mb-4">
                    <i id="cam-icon" class="fas fa-camera text-4xl text-gray-300"></i>
                    <p id="cam-text" class="text-gray-400 font-bold mt-2">Toque para selecionar foto</p>
                </div>
                <input type="file" id="file-input" class="hidden" accept="image/*">
                <button id="btn-analyze" onclick="startAnalysis()" class="hidden w-full bg-green-700 text-white py-4 rounded-xl font-black mt-4">ANALISAR AGORA</button>
                <button onclick="location.reload()" class="text-xs text-gray-400 mt-4 block mx-auto uppercase">Voltar</button>
            </div>
        </div>

        <div id="loader-area" class="hidden py-20 text-center">
            <div class="loader mx-auto mb-4"></div>
            <p class="text-green-800 font-black animate-pulse">PROCESSANDO DIAGNÓSTICO...</p>
        </div>

        <div id="result-area" class="hidden space-y-4">
            <div class="card p-6 laudo-content" id="output-text"></div>
            <button onclick="location.reload()" class="w-full bg-gray-900 text-white py-4 rounded-xl font-bold">NOVO EXAME</button>
        </div>
    </main>

    <script>
        const apiKey = "AIzaSyB3z48pV_WD2aFzq3fU5ND6sZw5UsRsfNw"; 
        let currentCulture = "";
        let base64Image = "";

        function selectCulture(c) {
            currentCulture = c;
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.remove('hidden');
        }

        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const res = ev.target.result;
                base64Image = res.split(',')[1];
                document.getElementById('preview').src = res;
                document.getElementById('preview').classList.remove('hidden');
                document.getElementById('cam-icon').classList.add('hidden');
                document.getElementById('cam-text').classList.add('hidden');
                document.getElementById('btn-analyze').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        });

        async function startAnalysis() {
            document.getElementById('step-2').classList.add('hidden');
            document.getElementById('loader-area').classList.remove('hidden');

            const payload = {
                contents: [{
                    parts: [
                        { text: `Analise esta planta de ${currentCulture}. Dê o nome da doença, diagnóstico, ação e prevenção.` },
                        { inlineData: { mimeType: "image/jpeg", data: base64Image } }
                    ]
                }]
            };

            try {
                // URL atualizada para v1 estável
                const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                const textoIA = data.candidates[0].content.parts[0].text;
                exibirResultado(textoIA);

            } catch (err) {
                alert("Erro: " + err.message);
                location.reload();
            }
        }

        function exibirResultado(text) {
            const out = document.getElementById('output-text');
            out.innerHTML = text
                .replace(/^# (.*$)/gim, '<h1>$1</h1>')
                .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
                .replace(/\n/g, '<br>');
            
            document.getElementById('loader-area').classList.add('hidden');
            document.getElementById('result-area').classList.remove('hidden');
        }
    </script>
</body>
</html>
