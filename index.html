<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro Scan - Inteligência Fitossanitária</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary: #1b4332; --secondary: #2d6a4f; --accent: #d8f3dc; --bg: #f4f7f5; }
        body { background-color: var(--bg); font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .gradient-header { background: linear-gradient(135deg, #081c15 0%, #1b4332 100%); }
        .card { background: white; border-radius: 1.5rem; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #2d6a4f; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .laudo-content h1 { color: #1b4332; font-weight: 900; font-size: 1.5rem; margin-bottom: 1rem; border-bottom: 2px solid #d8f3dc; padding-bottom: 0.5rem; }
        .laudo-content h2 { color: #2d6a4f; font-weight: 700; font-size: 1.1rem; margin-top: 1.5rem; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 8px; }
        .laudo-content p { color: #374151; line-height: 1.6; margin-bottom: 0.75rem; }
    </style>
</head>
<body class="pb-10">

    <header class="gradient-header text-white p-10 relative shadow-xl">
        <div class="max-w-4xl mx-auto">
            <div class="flex items-center gap-3">
                <i class="fas fa-leaf text-3xl text-green-300"></i>
                <h1 class="text-3xl font-black italic tracking-tighter">Agro Scan</h1>
            </div>
            <p class="text-green-200/80 text-sm mt-1">Especialista em Fitopatologia Digital</p>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 -mt-8">
        
        <div id="step-1" class="space-y-4">
            <h2 class="font-black text-gray-700 uppercase tracking-wide px-1">Escolha a Cultura</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <button onclick="selectCulture('Soja')" class="card p-6 flex flex-col items-center active:scale-95 transition-all">
                    <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center mb-2">
                        <i class="fas fa-seedling text-green-700"></i>
                    </div>
                    <span class="font-bold text-sm">Soja</span>
                </button>
                <button onclick="selectCulture('Feijão')" class="card p-6 flex flex-col items-center active:scale-95 transition-all">
                    <div class="w-12 h-12 bg-amber-100 rounded-full flex items-center justify-center mb-2">
                        <i class="fas fa-leaf text-amber-700"></i>
                    </div>
                    <span class="font-bold text-sm">Feijão</span>
                </button>
                <button onclick="selectCulture('Maracujá')" class="card p-6 flex flex-col items-center active:scale-95 transition-all">
                    <div class="w-12 h-12 bg-purple-100 rounded-full flex items-center justify-center mb-2">
                        <i class="fas fa-lemon text-purple-600"></i>
                    </div>
                    <span class="font-bold text-sm">Maracujá</span>
                </button>
                <button onclick="selectCulture('Laranja')" class="card p-6 flex flex-col items-center active:scale-95 transition-all">
                    <div class="w-12 h-12 bg-orange-100 rounded-full flex items-center justify-center mb-2">
                        <i class="fas fa-circle text-orange-500"></i>
                    </div>
                    <span class="font-bold text-sm">Laranja</span>
                </button>
            </div>
        </div>

        <div id="step-2" class="hidden space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="font-bold text-gray-700 uppercase text-xs">Cultura: <span id="display-culture" class="text-green-700"></span></h2>
                <button onclick="resetApp()" class="text-xs text-gray-400 font-bold uppercase">Voltar</button>
            </div>
            <div class="card p-2">
                <div class="relative bg-gray-100 rounded-2xl min-h-[250px] flex flex-col items-center justify-center border-2 border-dashed border-gray-300 overflow-hidden cursor-pointer" onclick="document.getElementById('file-input').click()">
                    <img id="preview" class="hidden w-full h-auto max-h-[400px] object-contain">
                    <div id="placeholder" class="text-center p-10">
                        <i class="fas fa-camera text-4xl text-gray-300 mb-2"></i>
                        <p class="text-gray-500 font-bold">Selecionar Foto</p>
                    </div>
                </div>
            </div>
            <input type="file" id="file-input" class="hidden" accept="image/*">
            <button id="btn-analyze" onclick="startAnalysis()" class="hidden w-full bg-green-700 text-white py-4 rounded-2xl font-black shadow-lg">
                ANALISAR COM IA
            </button>
        </div>

        <div id="loader-area" class="hidden py-20 text-center">
            <div class="loader mx-auto mb-4"></div>
            <p class="text-green-800 font-black animate-pulse">IDENTIFICANDO...</p>
        </div>

        <div id="result-area" class="hidden space-y-4">
            <div class="card p-6 laudo-content" id="output-text"></div>
            <button onclick="resetApp()" class="w-full bg-gray-900 text-white py-4 rounded-xl font-bold">NOVO EXAME</button>
        </div>
    </main>

    <script>
        // Use sua chave do Google AI Studio aqui se esta expirar
        const apiKey = "AIzaSyBjQPvocuYPI_ZsjmzWq0vaf5jHyhZFkME"; 
        let currentCulture = "";
        let base64Image = "";

        function selectCulture(c) {
            currentCulture = c;
            document.getElementById('display-culture').innerText = c;
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.remove('hidden');
        }

        function resetApp() {
            location.reload(); // Recarrega para limpar tudo de forma simples
        }

        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const fullBase64 = ev.target.result;
                base64Image = fullBase64.split(',')[1];
                document.getElementById('preview').src = fullBase64;
                document.getElementById('preview').classList.remove('hidden');
                document.getElementById('placeholder').classList.add('hidden');
                document.getElementById('btn-analyze').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        });

        async function startAnalysis() {
            const loader = document.getElementById('loader-area');
            const resultArea = document.getElementById('result-area');
            const step2 = document.getElementById('step-2');
            
            loader.classList.remove('hidden');
            step2.classList.add('hidden');

            const promptText = `Você é o Agro Scan. Analise esta imagem de uma plantação de ${currentCulture}. 
            Identifique a doença, causa, gravidade e plano de ação. Responda em Markdown usando # para títulos e ## para subtítulos.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: promptText },
                                { inlineData: { mimeType: "image/jpeg", data: base64Image } }
                            ]
                        }]
                    })
                });
                
                const data = await response.json();
                const resultText = data.candidates[0].content.parts[0].text;
                showResult(resultText);
            } catch (err) {
                alert("Erro na análise. Verifique a chave da API ou a internet.");
                console.error(err);
                loader.classList.add('hidden');
                step2.classList.remove('hidden');
            }
        }

        function showResult(text) {
            const output = document.getElementById('output-text');
            // Converte Markdown simples para HTML
            output.innerHTML = text
                .replace(/^# (.*$)/gim, '<h1>$1</h1>')
                .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
                .replace(/\n/g, '<br>');
            
            document.getElementById('loader-area').classList.add('hidden');
            document.getElementById('result-area').classList.remove('hidden');
        }
    </script>
</body>
</html>
