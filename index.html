<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro Scan | Cristyan</title>
</head>
<body style="font-family:sans-serif; padding:20px; background:#f0f4f8; text-align:center;">

    <h2 style="color:#064e3b;">AGRO SCAN - CRISTYAN</h2>

    <div style="background:white; padding:20px; border-radius:15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: auto;">
        <p><b>1. Escolha a planta:</b></p>
        <select id="cultura" style="width:100%; padding:10px; border-radius:8px;">
            <option value="maracuja">Maracujá</option>
            <option value="laranja">Laranja</option>
            <option value="soja">Soja</option>
            <option value="milho">Milho</option>
        </select>

        <p><b>2. Adicione a foto:</b></p>
        <input type="file" id="foto" accept="image/*" onchange="ver(this)" style="width:100%;">
        <br><br>
        <img id="pre" style="width:100%; display:none; border-radius:10px; border: 1px solid #ddd;">

        <button id="btn" onclick="enviar()" style="display:none; width:100%; padding:18px; background:#059669; color:white; border:none; border-radius:12px; font-weight:bold; margin-top:15px; cursor:pointer;">ANALISAR AGORA</button>
    </div>

    <div id="status" style="display:none; color:#064e3b; font-weight:bold; margin-top:20px;">EXAMINANDO...</div>
    <div id="res" style="margin-top:20px; background:white; padding:20px; border-radius:15px; display:none; text-align:left; max-width: 400px; margin: 20px auto;"></div>

    <script>
        const KEY = "AIzaSyCpiU5tzmwUKX_avjRbrO-dDtSNSGnSS40";
        let fotoData = "";

        function ver(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    // Aqui está o ajuste: limpando o cabeçalho do base64
                    fotoData = e.target.result.replace(/^data:image\/(png|jpg|jpeg|webp);base64,/, "");
                    document.getElementById('pre').src = e.target.result;
                    document.getElementById('pre').style.display = "block";
                    document.getElementById('btn').style.display = "block";
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function enviar() {
            document.getElementById('status').style.display = "block";
            document.getElementById('res').style.display = "none";
            document.getElementById('btn').style.display = "none";
            
            const planta = document.getElementById('cultura').value;

            try {
                const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + KEY, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "Você é um agrônomo. Analise a saúde desta folha de " + planta + ". Identifique doenças e sugira tratamentos em português." },
                                { inlineData: { mimeType: "image/jpeg", data: fotoData } }
                            ]
                        }]
                    })
                });

                const j = await r.json();
                
                if (j.candidates && j.candidates[0].content.parts[0].text) {
                    const texto = j.candidates[0].content.parts[0].text;
                    document.getElementById('res').innerHTML = "<h3 style='color:#064e3b;'>Diagnóstico:</h3>" + texto.replace(/\n/g, "<br>");
                    document.getElementById('res').style.display = "block";
                } else {
                    alert("A IA não conseguiu entender a foto. Tente uma mais clara.");
                }
            } catch (e) {
                alert("Erro ao conectar com a IA. Verifique sua internet.");
            } finally {
                document.getElementById('status').style.display = "none";
                document.getElementById('btn').style.display = "block";
            }
        }
    </script>
</body>
</html>
